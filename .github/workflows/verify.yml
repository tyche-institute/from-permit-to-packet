name: Verify release evidence

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install Python dependency
        run: python -m pip install -r requirements.txt
      - name: Verify corpus tests
        run: python -m unittest discover -s tests -v
      - name: Verify release manifest
        run: sha256sum -c SHA256SUMS
      - name: Verify checked-out prospective evidence
        run: node src/verify_prospective.mjs
      - name: Verify production prospective evidence
        run: node src/verify_prospective.mjs --remote
